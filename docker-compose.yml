services:
  postgres:
    image: postgres:17-alpine
    container_name: travel-map-postgres
    environment:
      POSTGRES_DB: travel_map
      POSTGRES_USER: travel_map
      POSTGRES_PASSWORD: travel_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_map -d travel_map"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
